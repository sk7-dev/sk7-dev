<svg viewBox="0 0 920 285" width="920" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="How I work: Research, Prototype, Measure, Ship, Iterate">
  <rect x="0.5" y="0.5" width="919" height="284" rx="14" fill="#0d1117" stroke="#1c222b"/>

  <!-- TITLE -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.7s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" begin="0.1s" dur="0.7s" fill="freeze"/>
    <text x="40" y="72" font-size="50" font-weight="500" fill="#ece5d6" letter-spacing="0.5"><tspan>How I </tspan><tspan font-style="italic">work</tspan><tspan>.</tspan></text>
    <circle cx="61" cy="94" r="5" fill="#58a6ff">
      <animate attributeName="r" values="5;6.6;5" dur="2.4s" begin="1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0.55;1" dur="2.4s" begin="1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- STEP 01 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.35s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.35s" dur="0.6s" fill="freeze"/>
    <text x="40" y="152" font-size="14" font-family="ui-monospace, 'Courier New', monospace" letter-spacing="2" fill="#6e7681">01</text>
    <rect x="40" y="160" width="0" height="3" rx="1.5" fill="#58a6ff"><animate attributeName="width" from="0" to="44" begin="0.55s" dur="0.5s" fill="freeze"/></rect>
    <text x="40" y="206" font-size="29" font-weight="500" fill="#ece5d6">Research</text>
    <text x="40" y="236" font-size="12.5" font-family="ui-monospace, 'Courier New', monospace" letter-spacing="0.4" fill="#8b949e"><tspan x="40">Papers, issues,</tspan><tspan x="40" dy="19">tickets, real users.</tspan></text>
  </g>

  <!-- STEP 02 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.5s" dur="0.6s" fill="freeze"/>
    <text x="222" y="152" font-size="14" font-family="ui-monospace, 'Courier New', monospace" letter-spacing="2" fill="#6e7681">02</text>
    <rect x="222" y="160" width="0" height="3" rx="1.5" fill="#58a6ff"><animate attributeName="width" from="0" to="44" begin="0.7s" dur="0.5s" fill="freeze"/></rect>
    <text x="222" y="206" font-size="29" font-weight="500" fill="#ece5d6">Prototype</text>
    <text x="222" y="236" font-size="12.5" font-family="ui-monospace, 'Courier New', monospace" letter-spacing="0.4" fill="#8b949e"><tspan x="222">Smallest thing that</tspan><tspan x="222" dy="19">proves it works.</tspan></text>
  </g>

  <!-- STEP 03 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.65s" dur="0.6s" fill="freeze"/>
    <text x="404" y="152" font-size="14" font-family="ui-monospace, 'Courier New', monospace" letter-spacing="2" fill="#6e7681">03</text>
    <rect x="404" y="160" width="0" height="3" rx="1.5" fill="#58a6ff"><animate attributeName="width" from="0" to="44" begin="0.85s" dur="0.5s" fill="freeze"/></rect>
    <text x="404" y="206" font-size="29" font-weight="500" fill="#ece5d6">Measure</text>
    <text x="404" y="236" font-size="12.5" font-family="ui-monospace, 'Courier New', monospace" letter-spacing="0.4" fill="#8b949e"><tspan x="404">Numbers before</tspan><tspan x="404" dy="19">opinions.</tspan></text>
  </g>

  <!-- STEP 04 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.8s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.8s" dur="0.6s" fill="freeze"/>
    <text x="586" y="152" font-size="14" font-family="ui-monospace, 'Courier New', monospace" letter-spacing="2" fill="#6e7681">04</text>
    <rect x="586" y="160" width="0" height="3" rx="1.5" fill="#58a6ff"><animate attributeName="width" from="0" to="44" begin="1s" dur="0.5s" fill="freeze"/></rect>
    <text x="586" y="206" font-size="29" font-weight="500" fill="#ece5d6">Ship</text>
    <text x="586" y="236" font-size="12.5" font-family="ui-monospace, 'Courier New', monospace" letter-spacing="0.4" fill="#8b949e"><tspan x="586">Every iteration held</tspan><tspan x="586" dy="19">to a production bar.</tspan></text>
  </g>

  <!-- STEP 05 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.95s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.95s" dur="0.6s" fill="freeze"/>
    <text x="768" y="152" font-size="14" font-family="ui-monospace, 'Courier New', monospace" letter-spacing="2" fill="#6e7681">05</text>
    <rect x="768" y="160" width="0" height="3" rx="1.5" fill="#58a6ff"><animate attributeName="width" from="0" to="44" begin="1.15s" dur="0.5s" fill="freeze"/></rect>
    <text x="768" y="206" font-size="29" font-weight="500" fill="#ece5d6">Iterate</text>
    <text x="768" y="236" font-size="12.5" font-family="ui-monospace, 'Courier New', monospace" letter-spacing="0.4" fill="#8b949e"><tspan x="768">Next pass builds on</tspan><tspan x="768" dy="19">solid ground.</tspan></text>
  </g>

  <!-- ARROWS -->
  <g fill="none" stroke="#58a6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M194 193 H214 M207 187 L215 193 L207 199" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.5s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="2.8s" begin="2s" repeatCount="indefinite"/>
    </path>
    <path d="M376 193 H396 M389 187 L397 193 L389 199" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.5s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="2.8s" begin="2.3s" repeatCount="indefinite"/>
    </path>
    <path d="M558 193 H578 M571 187 L579 193 L571 199" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.5s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="2.8s" begin="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M740 193 H760 M753 187 L761 193 L753 199" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="1.05s" dur="0.5s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="2.8s" begin="2.9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
