<svg viewBox="0 0 940 180" width="940" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, 'Times New Roman', serif" role="img" aria-label="How I work: Research, Prototype, Measure, Ship, Iterate">
  <rect x="0.5" y="0.5" width="939" height="179" rx="14" fill="#0d1117" stroke="#1c222b"/>

  <!-- STEP 01 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.15s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.15s" dur="0.6s" fill="freeze"/>
    <text x="40" y="44" font-size="13" letter-spacing="1.5" fill="#6e7681">01</text>
    <rect x="40" y="52" width="0" height="3" rx="1.5" fill="#58a6ff"><animate attributeName="width" from="0" to="44" begin="0.35s" dur="0.5s" fill="freeze"/></rect>
    <text x="40" y="99" font-size="30" font-weight="500" fill="#ece5d6">Research</text>
    <text x="40" y="130" font-size="12.5" letter-spacing="0.2" fill="#8b949e"><tspan x="40">Papers, issues,</tspan><tspan x="40" dy="18">tickets, real users.</tspan></text>
  </g>

  <!-- STEP 02 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.3s" dur="0.6s" fill="freeze"/>
    <text x="222" y="44" font-size="13" letter-spacing="1.5" fill="#6e7681">02</text>
    <rect x="222" y="52" width="0" height="3" rx="1.5" fill="#58a6ff"><animate attributeName="width" from="0" to="44" begin="0.5s" dur="0.5s" fill="freeze"/></rect>
    <text x="222" y="99" font-size="30" font-weight="500" fill="#ece5d6">Prototype</text>
    <text x="222" y="130" font-size="12.5" letter-spacing="0.2" fill="#8b949e"><tspan x="222">Smallest thing that</tspan><tspan x="222" dy="18">proves it works.</tspan></text>
  </g>

  <!-- STEP 03 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.45s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.45s" dur="0.6s" fill="freeze"/>
    <text x="404" y="44" font-size="13" letter-spacing="1.5" fill="#6e7681">03</text>
    <rect x="404" y="52" width="0" height="3" rx="1.5" fill="#58a6ff"><animate attributeName="width" from="0" to="44" begin="0.65s" dur="0.5s" fill="freeze"/></rect>
    <text x="404" y="99" font-size="30" font-weight="500" fill="#ece5d6">Measure</text>
    <text x="404" y="130" font-size="12.5" letter-spacing="0.2" fill="#8b949e"><tspan x="404">Numbers before</tspan><tspan x="404" dy="18">opinions.</tspan></text>
  </g>

  <!-- STEP 04 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.6s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.6s" dur="0.6s" fill="freeze"/>
    <text x="586" y="44" font-size="13" letter-spacing="1.5" fill="#6e7681">04</text>
    <rect x="586" y="52" width="0" height="3" rx="1.5" fill="#58a6ff"><animate attributeName="width" from="0" to="44" begin="0.8s" dur="0.5s" fill="freeze"/></rect>
    <text x="586" y="99" font-size="30" font-weight="500" fill="#ece5d6">Ship</text>
    <text x="586" y="130" font-size="12.5" letter-spacing="0.2" fill="#8b949e"><tspan x="586">Every iteration held</tspan><tspan x="586" dy="18">to a production bar.</tspan></text>
  </g>

  <!-- STEP 05 -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" begin="0.75s" dur="0.6s" fill="freeze"/>
    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="0.75s" dur="0.6s" fill="freeze"/>
    <text x="768" y="44" font-size="13" letter-spacing="1.5" fill="#6e7681">05</text>
    <rect x="768" y="52" width="0" height="3" rx="1.5" fill="#58a6ff"><animate attributeName="width" from="0" to="44" begin="0.95s" dur="0.5s" fill="freeze"/></rect>
    <text x="768" y="99" font-size="30" font-weight="500" fill="#ece5d6">Iterate</text>
    <text x="768" y="130" font-size="12.5" letter-spacing="0.2" fill="#8b949e"><tspan x="768">Next pass builds on</tspan><tspan x="768" dy="18">solid ground.</tspan></text>
  </g>

  <!-- ARROWS -->
  <g fill="none" stroke="#58a6ff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M194 86 H214 M207 80 L215 86 L207 92" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.4s" dur="0.5s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="2.8s" begin="2s" repeatCount="indefinite"/>
    </path>
    <path d="M376 86 H396 M389 80 L397 86 L389 92" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.55s" dur="0.5s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="2.8s" begin="2.3s" repeatCount="indefinite"/>
    </path>
    <path d="M558 86 H578 M571 80 L579 86 L571 92" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.7s" dur="0.5s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="2.8s" begin="2.6s" repeatCount="indefinite"/>
    </path>
    <path d="M740 86 H760 M753 80 L761 86 L753 92" opacity="0">
      <animate attributeName="opacity" from="0" to="1" begin="0.85s" dur="0.5s" fill="freeze"/>
      <animate attributeName="opacity" values="1;0.35;1" dur="2.8s" begin="2.9s" repeatCount="indefinite"/>
    </path>
  </g>
</svg>
